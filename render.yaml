services:
  - type: web
    name: commitiq-api
    env: python
    repo: https://github.com/prashobnair/commitiq.git
    directory: backend
    buildCommand: |
      apt-get update && apt-get install -y wkhtmltopdf fontconfig libfontconfig1 libfreetype6 libpng16-16 libjpeg-turbo8 libxrender1 libx11-6 libxext6 libcairo2 libpango-1.0-0 && 
      pip install -r requirements.txt
    startCommand: python init_db.py && hypercorn run:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      - key: PORT
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DB_HOST
        fromDatabase:
          name: commitiq-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: commitiq-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: commitiq-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: commitiq-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: commitiq-db
          property: password
      - key: FRONTEND_URL
        value: https://commitiq-frontend.onrender.com
      - key: EMAIL_HASH_PEPPER
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: REDIS_ENABLED
        value: false

  - type: web
    name: commitiq-frontend
    env: static
    repo: https://github.com/prashobnair/commitiq.git
    directory: frontend
    buildCommand: chmod +x build.sh && ./build.sh
    staticPublishPath: ./build
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18.x
      - key: REACT_APP_API_URL
        value: https://commitiq-api.onrender.com/api

databases:
  - name: commitiq-db
    plan: free
    databaseName: github_data
    user: commitiq 