name: Keep Render Alive
on:
  schedule:
    - cron: "*/14 * * * *"  # Runs every 14 minutes
  workflow_dispatch:         # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping services
        run: |
          # Replace with your Render service URLs
          curl -s -o /dev/null https://commitiq-api.onrender.com
          curl -s -o /dev/null https://commitiq-frontend.onrender.com