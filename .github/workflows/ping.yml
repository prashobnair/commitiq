name: Keep Render Alive
on:
  schedule:
    - cron: "5,10,15,20,25,30,35,40,45,50,55,0 * * * *"  
  workflow_dispatch:         # Allows manual triggering
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping services
        run: |
          # Replace with your Render service URLs
          curl -s -o /dev/null https://commitiq-api.onrender.com/api/health
          curl -s -o /dev/null https://commitiq-frontend.onrender.com
